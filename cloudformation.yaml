AWSTemplateFormatVersion: '2010-09-09'
Description: >
  S3 + CloudFront CDN + ACM certificate for legal.
  Domain: legal.lbenicio.dev
  Deploy in any region — cert is in us-east-1 (CloudFront requirement).
  DNS at Cloudflare; add validation CNAMEs and site CNAME there.

Parameters:
  DomainName:
    Type: String
    Description: Primary domain.
    Default: legal.lbenicio.dev

  CertificateArn:
    Type: String
    Description: >
      ARN of an existing ACM certificate in us-east-1 covering the domain.
      Leave empty to create a new one (stack must be deployed to us-east-1).
    Default: arn:aws:acm:us-east-1:527540700211:certificate/2459ba0d-fa86-4110-a67d-67ae1669e10d

  PriceClass:
    Type: String
    AllowedValues: [PriceClass_All, PriceClass_200, PriceClass_100]
    Default: PriceClass_100

Conditions:
  CreateCertificate: !Equals [!Ref CertificateArn, '']

Resources:
  # ── S3 bucket (private, CloudFront OAC only) ────────────────────────────
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DomainName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: legal
        - Key: ManagedBy
          Value: cloudformation

  # ── CloudFront OAC ──────────────────────────────────────────────────────
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: legal-oac
        Description: OAC — only CloudFront can read the S3 origin
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── Bucket policy ───────────────────────────────────────────────────────
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Join ['', [!GetAtt SiteBucket.Arn, '/*']]
          - Sid: DenyNonSecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Join ['', [!GetAtt SiteBucket.Arn, '/*']]
              - !GetAtt SiteBucket.Arn
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # ── ACM certificate (only created if CertificateArn is empty) ───────────
  SiteCertificate:
    Condition: CreateCertificate
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      Tags:
        - Key: Project
          Value: legal

  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-index-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve static Next.js routes to exported HTML files.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/') request.uri = '/index.html';
          else if (request.uri.endsWith('/')) request.uri = request.uri.slice(0, -1);
          if (!request.uri.includes('.')) request.uri += '.html';
          return request;
        }

  # ── Security headers ────────────────────────────────────────────────────
  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: legal-security-headers
        Comment: Security headers for legal.lbenicio.dev
        SecurityHeadersConfig:
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: false
            Preload: false
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          XSSProtection:
            Override: true
            Protection: true
            ModeBlock: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: 'camera=(), microphone=(), geolocation=(), interest-cohort=()'
              Override: true

  # ── CloudFront distribution ─────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        DefaultRootObject: index.html
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        Aliases:
          - !Ref DomainName
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: s3-origin
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          ForwardedValues:
            QueryString: false
            Headers: [Origin]
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CacheBehaviors:
          - PathPattern: _next/static/*
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            MinTTL: 0
            DefaultTTL: 31536000
            MaxTTL: 31536000
          - PathPattern: assets/*
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            MinTTL: 0
            DefaultTTL: 31536000
            MaxTTL: 31536000
        CustomErrorResponses:
          - ErrorCode: 400
            ResponseCode: 400
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 405
            ResponseCode: 405
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 414
            ResponseCode: 414
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 416
            ResponseCode: 416
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ResponseCode: 500
            ResponsePagePath: /500.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 501
            ResponseCode: 501
            ResponsePagePath: /500.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ResponseCode: 502
            ResponsePagePath: /500.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ResponseCode: 503
            ResponsePagePath: /500.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ResponseCode: 504
            ResponsePagePath: /500.html
            ErrorCachingMinTTL: 0
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          AcmCertificateArn:
            !If [CreateCertificate, !Ref SiteCertificate, !Ref CertificateArn]
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.3_2025
      Tags:
        - Key: Project
          Value: legal

Outputs:
  S3BucketName:
    Description: S3 bucket — upload built site here.
    Value: !Ref SiteBucket

  CloudFrontDomainName:
    Description: CloudFront domain. Create a CNAME pointing your domain to this.
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontDistributionId:
    Description: Distribution ID for cache invalidations.
    Value: !Ref CloudFrontDistribution

  CertificateArn:
    Description: ACM certificate ARN.
    Value: !If [CreateCertificate, !Ref SiteCertificate, !Ref CertificateArn]

  ValidationCNAMEs:
    Description: >
      If a new cert was created, run this to get DNS validation CNAMEs.
      Add them in Cloudflare to issue the certificate.
    Value: !Sub
      - |
        aws acm describe-certificate \
          --region us-east-1 \
          --certificate-arn ${certArn} \
          --query "Certificate.DomainValidationOptions[*].{Domain:DomainName,CNAME_Name:ResourceRecord.Name,CNAME_Value:ResourceRecord.Value}" \
          --output table
      - certArn:
          !If [CreateCertificate, !Ref SiteCertificate, !Ref CertificateArn]

  NextSteps:
    Description: Deployment instructions.
    Value: !Sub
      - |
        ============================================================
        DEPLOY — ${domain}
        ============================================================

        1. Deploy the stack:
           aws cloudformation deploy \
             --region ${region} \
             --stack-name legal \
             --template-file cloudformation.yaml \
             --tags awsApplication=arn:aws:resource-groups:sa-east-1:527540700211:group/lbenicio-community/06owkw4s6gp5r894wctvv2jj5u

        2. If a new cert was created, get validation CNAMEs:
           ${getValidationCommand}

           Add each CNAME in Cloudflare DNS (Proxy: OFF).
           Example:
             Name:  _abc123.${domain}
             Value: _xyz456.acm-validations.aws.

        3. Add the site CNAME in Cloudflare:
             Name:  legal
             Value: ${cfDomain}
             Proxy: OFF (DNS only)

        4. Build and upload:
           npm run build:prod
           aws s3 sync out/ s3://${domain}/ --delete

        5. Invalidate CloudFront cache:
           aws cloudfront create-invalidation \
             --distribution-id ${cfId} \
             --paths "/*"

        6. Visit https://${domain}
        ============================================================
      - domain: !Ref DomainName
        region: !Ref AWS::Region
        cfDomain: !GetAtt CloudFrontDistribution.DomainName
        cfId: !Ref CloudFrontDistribution
        getValidationCommand: !Sub
          - |
            aws acm describe-certificate \
              --region us-east-1 \
              --certificate-arn ${certArn} \
              --query "Certificate.DomainValidationOptions[*].{Domain:DomainName,CNAME_Name:ResourceRecord.Name,CNAME_Value:ResourceRecord.Value}" \
              --output table
          - certArn:
              !If [CreateCertificate, !Ref SiteCertificate, !Ref CertificateArn]
